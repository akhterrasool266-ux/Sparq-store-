name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 6:00 AM UTC (safe margin under Supabase's 7-day pause limit)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # lets you run it manually anytime from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          curl -s -o /dev/null -w "Supabase ping response code: %{http_code}\n" \
            "https://xrxcrrifadwvgknxleeb.supabase.co/rest/v1/products?select=id&limit=1" \
